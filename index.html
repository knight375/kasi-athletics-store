<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>Kasi Athletics — Move your way</title>
  <style>
    :root {
      --ink: #171a18;
      --muted: #727873;
      --line: #e5e8e4;
      --paper: #fff;
      --wash: #f5f6f4;
      --accent: #ff623c;
      --accent-dark: #e84925;
      --radius: 18px;
      --shadow: 0 16px 44px rgba(23, 26, 24, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--wash);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--wash); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .shell { max-width: 1240px; margin: auto; padding: 0 28px; }
    header {
      height: 76px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px);
    }
    .header-inner { height: 100%; display: flex; align-items: center; gap: 30px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 850; letter-spacing: -.7px; white-space: nowrap; }
    .brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--ink); color: white; font-size: 14px; letter-spacing: -1px; }
    .main-nav { display: flex; gap: 25px; margin-left: 12px; font-size: 13px; font-weight: 650; color: #555b56; }
    .main-nav a:hover, .main-nav a.active { color: var(--ink); }
    .header-tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .account-link { min-height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: white; font-size: 12px; font-weight: 750; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; color: var(--ink); }
    .account-icon { font-size: 15px; }
    .search-wrap { position: relative; }
    .search-wrap input { width: 190px; height: 42px; border: 1px solid var(--line); background: var(--wash); border-radius: 999px; padding: 0 16px 0 39px; outline: none; font-size: 13px; }
    .search-wrap input:focus { border-color: #a4aaa4; }
    .search-icon { position: absolute; left: 14px; top: 12px; color: var(--muted); font-size: 15px; }
    .icon-button { width: 43px; height: 43px; display: grid; place-items: center; background: white; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); position: relative; }
    .cart-count { position: absolute; right: -3px; top: -4px; background: var(--accent); color: white; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 12px; font-size: 11px; display: grid; place-items: center; font-weight: 800; }
    main { padding: 34px 0 72px; min-height: calc(100vh - 146px); }
    .eyebrow { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 800; color: var(--muted); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(36px, 6vw, 64px); letter-spacing: -3px; line-height: .99; margin: 14px 0 19px; }
    h2 { font-size: 28px; letter-spacing: -1px; margin-bottom: 8px; }
    .subtle { color: var(--muted); line-height: 1.6; }
    .btn { border: 0; border-radius: 999px; padding: 14px 22px; min-height: 48px; font-weight: 800; font-size: 13px; transition: transform .18s, background .18s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: white; border: 1px solid var(--line); color: var(--ink); }
    .btn-block { width: 100%; }
    .btn-disabled { background: #e7e9e6; color: #777d78; cursor: not-allowed; }
    .btn-disabled:hover { transform: none; background: #e7e9e6; }
    .hero { border-radius: 26px; min-height: 390px; padding: clamp(30px, 6vw, 76px); display: grid; grid-template-columns: 1fr .9fr; align-items: center; overflow: hidden; background: #e9eee9; position: relative; }
    .hero-copy { max-width: 490px; z-index: 1; }
    .hero h1 span { color: #707c70; }
    .hero .subtle { max-width: 380px; margin-bottom: 25px; }
    .hero-art { min-height: 300px; position: relative; display: grid; place-items: center; }
    .hero-shape { position: absolute; width: min(33vw, 370px); height: min(33vw, 370px); background: #d7dfd7; border-radius: 50%; }
    .hero-photo { z-index: 1; width: min(100%, 460px); height: 310px; object-fit: cover; border-radius: 22px; transform: rotate(-5deg); box-shadow: 0 26px 38px rgba(31,40,33,.16); }
    .hero-note { position: absolute; bottom: 10px; right: 3%; background: white; padding: 13px 17px; border-radius: 14px; box-shadow: var(--shadow); z-index: 2; font-size: 12px; font-weight: 750; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 54px 0 21px; }
    .section-head h2 { margin: 8px 0 0; }
    .text-link { font-size: 13px; font-weight: 800; border-bottom: 1px solid #aeb5af; padding-bottom: 4px; }
    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .category-card { min-height: 175px; padding: 24px; border-radius: var(--radius); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; transition: transform .2s; }
    .category-card:hover { transform: translateY(-3px); }
    .category-card:nth-child(1) { background: #e9e7df; }
    .category-card:nth-child(2) { background: #e6ece8; }
    .category-card:nth-child(3) { background: #ece7e1; }
    .category-card strong { font-size: 19px; letter-spacing: -.5px; }
    .category-card small { color: #656b66; margin-top: 6px; }
    .category-symbol { align-self: flex-end; font-size: 44px; opacity: .76; }
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .product-card { min-width: 0; }
    .product-visual { position: relative; aspect-ratio: 1/1; border-radius: 17px; background: #edeFEB; display: grid; place-items: center; overflow: hidden; cursor: pointer; }
    .product-photo { width: 100%; height: 100%; object-fit: cover; transition: transform .25s; }
    .product-card:hover .product-photo { transform: scale(1.045); }
    .heart { position: absolute; right: 11px; top: 11px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255,255,255,.94); color: #272b28; font-size: 19px; display: grid; place-items: center; z-index: 2; }
    .heart.saved { color: var(--accent); }
    .product-info { padding: 12px 2px 0; display: flex; justify-content: space-between; gap: 8px; }
    .product-info strong { display: block; font-size: 14px; }
    .product-info span { font-size: 13px; font-weight: 750; white-space: nowrap; }
    .product-info del { color: var(--muted); font-size: 11px; font-weight: 500; }
    .product-badges { min-height: 17px; display: flex; gap: 5px; padding: 5px 2px 0; }
    .product-badge { border-radius: 999px; padding: 3px 7px; background: #e7eee7; color: #3b6042; font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .product-badge.sale { background: #fff0e9; color: #a94328; }
    .product-info small { display: block; color: var(--muted); margin-top: 5px; font-size: 12px; }
    .product-variants { display: flex; align-items: center; gap: 7px; padding: 10px 2px 0; }
    .product-variants button { width: 18px; height: 18px; padding: 0; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
    .product-variants button.selected { box-shadow: 0 0 0 2px var(--ink); }
    .product-variants small { color: var(--muted); font-size: 10px; }
    .product-card-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding-top: 10px; }
    .product-card-controls select { min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: white; padding: 0 8px; font-size: 11px; }
    .product-card-controls .btn { min-height: 38px; padding: 8px 7px; font-size: 10px; }
    .product-card-controls .card-buy { grid-column: 1 / -1; }
    .listing-top { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
    .filters select { min-width: 130px; height: 42px; padding: 0 35px 0 13px; border: 1px solid var(--line); border-radius: 10px; background: white; color: var(--ink); font-size: 13px; }
    .results-count { font-size: 12px; color: var(--muted); }
    .detail-layout { display: grid; grid-template-columns: 1.04fr .96fr; gap: clamp(30px, 7vw, 88px); align-items: start; }
    .detail-image { background: #e9ede9; border-radius: 22px; min-height: 460px; display: grid; place-items: center; overflow: hidden; }
    .detail-image .product-photo { width: 100%; height: 100%; min-height: inherit; object-fit: cover; }
    .detail-copy { padding-top: 12px; }
    .detail-copy h1 { font-size: 42px; margin: 11px 0; letter-spacing: -2px; }
    .detail-price { font-size: 19px; font-weight: 800; margin: 0 0 17px; }
    .field-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin: 26px 0 12px; }
    .swatches { display: flex; gap: 12px; }
    .swatch { width: 37px; height: 37px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 1px #dce1dc; }
    .swatch.selected { box-shadow: 0 0 0 2px var(--ink); }
    .sizes { display: flex; flex-wrap: wrap; gap: 9px; }
    .size-btn { min-width: 51px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: white; font-size: 13px; font-weight: 750; }
    .size-btn.selected { background: var(--ink); color: white; border-color: var(--ink); }
    .buy-row { display: grid; grid-template-columns: 1fr 54px; gap: 10px; margin: 25px 0 18px; }
    .buy-row .heart { position: static; border: 1px solid var(--line); width: 54px; height: 50px; }
    .assurance { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .info-panels { margin-top: 54px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { background: white; border: 1px solid var(--line); border-radius: 15px; padding: 22px; }
    .panel h3 { font-size: 15px; margin: 0 0 12px; }
    .panel p { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 0; }
    .reviews { grid-column: 1 / -1; }
    .review { padding: 14px 0; border-top: 1px solid var(--line); }
    .review:first-of-type { border: 0; }
    .review-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
    .stars { color: #d88c2e; letter-spacing: 1px; }
    .customizer-layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: 38px; align-items: stretch; }
    .preview-box { min-height: 480px; border-radius: 23px; background: #e9ede9; display: grid; place-items: center; position: relative; overflow: hidden; }
    .preview-box:before { content: ""; position: absolute; width: 65%; aspect-ratio: 1; border-radius: 50%; background: #dce4dc; }
    .preview-box .shoe-svg { width: 91%; z-index: 1; transform: rotate(-7deg); filter: drop-shadow(0 24px 18px rgba(25,34,27,.17)); }
    .preview-caption { position: absolute; left: 20px; bottom: 18px; z-index: 2; background: white; border-radius: 12px; padding: 10px 13px; font-size: 12px; font-weight: 750; }
    .custom-controls { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 27px; }
    .custom-controls h2 { margin: 7px 0 7px; }
    .option-group { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .option-title { font-size: 13px; font-weight: 800; margin-bottom: 13px; display: flex; justify-content: space-between; }
    .color-choice { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .color-choice button { border: 0; padding: 0; background: transparent; display: grid; justify-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
    .color-dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 1px #d8ddd8; }
    .color-choice button.selected .color-dot { box-shadow: 0 0 0 2px var(--ink); }
    .custom-price { display: flex; justify-content: space-between; margin: 19px 0; font-size: 14px; font-weight: 800; }
    .custom-actions { display: grid; gap: 10px; }
    .cart-layout { display: grid; grid-template-columns: 1.3fr .7fr; gap: 28px; align-items: start; }
    .cart-items, .summary-card { background: white; border: 1px solid var(--line); border-radius: 18px; }
    .cart-items { padding: 8px 24px; }
    .cart-row { display: grid; grid-template-columns: 90px 1fr auto; gap: 17px; align-items: center; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .cart-row:last-child { border: 0; }
    .cart-thumb { height: 82px; width: 90px; border-radius: 12px; background: #eef0ed; display: grid; place-items: center; overflow: hidden; }
    .cart-thumb .shoe-svg { width: 110%; }
    .cart-thumb .product-photo { width: 100%; height: 100%; object-fit: cover; }
    .cart-row strong { display: block; font-size: 14px; }
    .cart-row small { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
    .qty-control { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; width: max-content; }
    .qty-control button { border: 0; background: transparent; width: 31px; height: 29px; font-weight: 800; }
    .qty-control span { font-size: 12px; min-width: 18px; text-align: center; }
    .cart-row-price { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .remove-button { background: none; border: 0; color: var(--muted); display: block; font-size: 11px; margin: 5px 0 0 auto; text-decoration: underline; }
    .summary-card { padding: 23px; }
    .summary-card h3 { margin: 0 0 20px; font-size: 17px; }
    .payment-title { font-size: 14px; font-weight: 800; margin: 24px 0 12px; }
    .payment-option { display: flex; gap: 11px; align-items: flex-start; padding: 13px 12px; margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    .payment-option:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .payment-option input { margin-top: 3px; accent-color: var(--ink); }
    .payment-option strong { display: block; font-size: 13px; }
    .payment-option small { display: block; margin-top: 4px; color: var(--muted); line-height: 1.4; font-size: 11px; }
    .checkout-contact { margin: 15px 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .summary-line { display: flex; justify-content: space-between; margin: 13px 0; font-size: 13px; color: var(--muted); }
    .summary-line.total { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; font-size: 16px; color: var(--ink); font-weight: 850; }
    .empty-state { background: white; border: 1px solid var(--line); border-radius: 18px; text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 40px; margin-bottom: 14px; }
    .confirmation { max-width: 670px; margin: 40px auto; text-align: center; background: white; border: 1px solid var(--line); border-radius: 24px; padding: clamp(30px, 7vw, 68px); }
    .confirm-icon { margin: 0 auto 20px; height: 68px; width: 68px; border-radius: 50%; background: #e9f2ea; display: grid; place-items: center; color: #327344; font-size: 30px; }
    .confirmation h1 { font-size: 43px; letter-spacing: -2px; }
    .auth-panel { width: min(100%, 520px); margin: 20px auto; padding: clamp(24px, 5vw, 42px); background: white; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
    .auth-panel h1 { font-size: clamp(34px, 6vw, 46px); letter-spacing: -2px; margin: 9px 0 12px; }
    .auth-form { display: grid; gap: 15px; margin-top: 24px; }
    .auth-field { display: grid; gap: 7px; }
    .auth-field label { font-size: 13px; font-weight: 750; }
    .auth-field input { width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; outline: none; }
    .auth-field input:focus { border-color: #7d867e; box-shadow: 0 0 0 3px rgba(80, 110, 82, .13); }
    .auth-field input[aria-invalid="true"] { border-color: #bd3f2a; }
    .field-error { min-height: 0; margin: 0; color: #a53222; font-size: 12px; line-height: 1.4; }
    .auth-password-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .auth-text-button { color: #464e48; background: transparent; border: 0; padding: 2px 0; text-decoration: underline; font-size: 12px; font-weight: 700; }
    .auth-footer { margin: 20px 0 0; text-align: center; font-size: 13px; }
    .auth-notice { margin: 14px 0 0; padding: 11px 13px; border-radius: 10px; background: #f3f5f2; color: #4a514b; font-size: 12px; line-height: 1.5; }
    .account-layout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; }
    .account-details { display: grid; gap: 12px; }
    .account-details div { display: grid; gap: 4px; }
    .account-details strong { font-size: 12px; color: var(--muted); }
    .account-actions { display: flex; justify-content: flex-end; }
    .guest-checkout-note { margin: 14px 0 0; padding: 13px; border-radius: 12px; background: var(--wash); color: var(--muted); font-size: 12px; line-height: 1.5; }
    .order-number { background: var(--wash); border-radius: 10px; padding: 12px; margin: 20px 0 25px; font-size: 13px; font-weight: 750; }
    footer { border-top: 1px solid var(--line); padding: 22px 0; background: white; color: var(--muted); font-size: 12px; }
    .footer-inner { display: flex; justify-content: space-between; gap: 14px; }
    .toast { position: fixed; z-index: 50; bottom: 25px; left: 50%; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: white; border-radius: 999px; padding: 13px 20px; font-size: 13px; font-weight: 750; transition: .25s; pointer-events: none; box-shadow: var(--shadow); }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .mobile-cart { display: none; }
    @media (max-width: 850px) {
      .shell { padding: 0 20px; }
      .main-nav { gap: 15px; margin-left: 0; }
      .search-wrap input { width: 155px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-layout { gap: 28px; }
      .detail-image { min-height: 370px; }
      .customizer-layout { gap: 20px; }
      .preview-box { min-height: 420px; }
    }
    @media (max-width: 620px) {
      .shell { padding: 0 16px; }
      header { height: 64px; }
      .header-inner { gap: 12px; }
      .brand { font-size: 16px; gap: 7px; }
      .brand-mark { width: 30px; height: 30px; font-size: 12px; border-radius: 9px; }
      .main-nav { display: none; }
      .header-tools { gap: 8px; }
      .account-link { min-height: 38px; padding: 0 8px; font-size: 10px; gap: 4px; }
      .account-icon { font-size: 13px; }
      .search-wrap input { width: 40px; height: 40px; padding: 0; color: transparent; cursor: pointer; }
      .search-wrap input:focus { width: min(44vw, 175px); padding: 0 12px 0 36px; color: var(--ink); position: absolute; right: 0; top: 0; z-index: 4; }
      .search-icon { left: 13px; top: 11px; pointer-events: none; z-index: 5; }
      .icon-button { width: 40px; height: 40px; }
      main { padding: 22px 0 54px; }
      .hero { min-height: 520px; padding: 29px 24px 0; grid-template-columns: 1fr; align-content: start; }
      .hero h1 { font-size: 48px; margin-top: 11px; }
      .hero .subtle { font-size: 14px; }
      .hero-art { min-height: 245px; margin: -4px -6px 0; }
      .hero-shape { width: 240px; height: 240px; }
      .hero-photo { width: min(112%, 400px); height: 220px; }
      .hero-note { right: 0; bottom: 3px; }
      .section-head { margin: 40px 0 17px; }
      .section-head h2 { font-size: 23px; }
      .category-grid { gap: 10px; }
      .category-card { min-height: 137px; padding: 15px 13px; border-radius: 14px; }
      .category-card strong { font-size: 14px; }
      .category-card small { font-size: 10px; line-height: 1.3; }
      .category-symbol { font-size: 30px; }
      .product-grid { gap: 16px 11px; }
      .product-info { padding-top: 9px; }
      .product-info strong { font-size: 12px; }
      .product-info span { font-size: 12px; }
      .product-info small { font-size: 11px; }
      .heart { width: 34px; height: 34px; right: 8px; top: 8px; }
      .listing-top { display: block; margin-bottom: 19px; }
      .listing-top h1 { font-size: 38px; }
      .filters { gap: 7px; }
      .filters select { min-width: 0; flex: 1 1 calc(50% - 7px); height: 40px; padding-left: 9px; font-size: 11px; }
      .detail-layout, .customizer-layout, .cart-layout { grid-template-columns: 1fr; gap: 22px; }
      .detail-image { min-height: 330px; }
      .detail-copy { padding: 0 2px; }
      .detail-copy h1 { font-size: 36px; }
      .field-label { margin-top: 21px; }
      .info-panels { margin-top: 30px; grid-template-columns: 1fr; }
      .reviews { grid-column: auto; }
      .preview-box { min-height: 340px; }
      .custom-controls { padding: 23px; }
      .cart-items { padding: 5px 14px; }
      .cart-row { grid-template-columns: 68px 1fr auto; gap: 11px; }
      .cart-thumb { width: 68px; height: 68px; }
      .cart-row strong { font-size: 12px; }
      .cart-row-price { font-size: 12px; }
      .footer-inner { flex-direction: column; }
      .confirmation { margin: 20px auto; }
      .confirmation h1 { font-size: 38px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell header-inner">
      <a class="brand" href="#home" aria-label="Kasi Athletics home"><span class="brand-mark">KA</span><span>Kasi Athletics</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#shop">Shop all</a><a href="#customize">Customize</a><a href="#shop?category=Campus%20Collection">Campus</a>
      </nav>
      <div class="header-tools">
        <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" aria-label="Search products" placeholder="Search gear"></label>
        <button type="button" class="account-link" id="account-nav" aria-label="Log in or open your account"><span class="account-icon" aria-hidden="true">♙</span><span id="account-nav-label">Log in</span></button>
        <button class="icon-button" id="cart-nav" aria-label="Open cart">🛍<span class="cart-count" id="cart-count">0</span></button>
      </div>
    </div>
  </header>
  <main class="shell" id="app"></main>
  <footer><div class="shell footer-inner"><span>© 2025 Kasi Athletics · Made for the everyday move.</span><span>Original colorway placeholders · Delivery across Kenya</span></div></footer>
  <div class="toast" id="toast" role="status" aria-live="polite">Added to cart ✓</div>
  <script src="./payments-config.js"></script>
  <script type="module">
    import products from "./catalog.json" with { type: "json" };

    const state = {
      screen: "home",       category: "All", gender: "All", size: "", priceRange: "All", search: "", color: "All", sort: "newest", orderTotal: 0,
      cart: [], saved: [], selectedSize: "", selectedColor: 0, selectedProduct: products[1],
      customization: { body: "#e8d8bb", laces: "#f7f7f2", sole: "#282b2a" }, designSaved: false,
      cardSelections: {}, paymentEnabled: false, paymentMessage: "Secure online payments are not set up yet.",
      checkoutBusy: false, checkoutOrderId: "", paymentStatusMessage: "",
      user: null, returnTo: "home", authNotice: "", authBusy: false, authSync: Promise.resolve()
    };
    const app = document.getElementById("app");
    const iconShoe = (body, sole, laces, id = "shoe") => `
      <svg class="shoe-svg" viewBox="0 0 440 280" role="img" aria-label="Custom sneaker color preview">
        <defs><linearGradient id="${id}-shade" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".33"/><stop offset="1" stop-color="#161a17" stop-opacity=".1"/></linearGradient></defs>
        <path d="M56 178c24-3 49-18 74-44l40-48c11-13 30-10 38 3l34 54c15 22 37 31 76 37l55 8c20 3 35 17 35 34v12H62c-25 0-40-11-40-27 0-13 12-24 34-29Z" fill="${body}" stroke="#232925" stroke-width="7" stroke-linejoin="round"/>
        <path d="M63 200c40 3 77-11 110-32 31-20 61-28 91-21 25 6 46 22 68 27l50 11c17 4 26 15 26 30v10H61c-25 0-39-8-39-20 0-10 14-7 41-5Z" fill="url(#${id}-shade)" opacity=".8"/>
        <path d="M31 216c82 8 128-7 187-20 53-12 75 4 118 16 31 8 54 6 74 7 11 1 17 9 14 18-3 10-13 15-31 16H59c-28 0-42-9-42-22 0-10 5-15 14-15Z" fill="${sole}" stroke="#232925" stroke-width="7" stroke-linejoin="round"/>
        <path d="m177 97 55 60m-68-42 54 59m-72-38 50 54" fill="none" stroke="${laces}" stroke-width="9" stroke-linecap="round"/>
        <path d="M100 178c25-9 38-23 51-39m138 20 24 30" fill="none" stroke="#232925" stroke-width="6" stroke-linecap="round" opacity=".8"/>
        <path d="M74 205h51m197 20h42" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
      </svg>`;
    function productArt(product, colorIndex = 0) {
      const color = product.colors[colorIndex] || product.colors[0];
      return `<img class="product-photo" src="${color.image}" alt="${color.name} ${product.name}" loading="lazy">`;
    }
    function go(screen, query = {}) {
      state.screen = screen;
      if (screen === "shop") {
        state.category = query.category || "All";
        state.priceRange = "All"; state.size = ""; state.gender = "All"; state.color = "All"; state.sort = "newest";
      }
      if (screen === "product") {
        state.selectedProduct = query.product || products[1];
        state.selectedColor = 0; state.selectedSize = "";
      }
      if (screen === "cart") state.ordered = false;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      location.hash = screen === "shop" && state.category !== "All" ? `shop?category=${state.category}` : screen;
    }
    function money(value) { return `KES ${value.toLocaleString("en-KE")}`; }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);
    }
    function productPrice(product) { return product.salePrice ?? product.price; }
    function productSizes(product) {
      return product.sizes.filter(size => size !== "One size");
    }
    function productSwatch(product, index) {
      const color = product.colors[index] || product.colors[0];
      return `<button type="button" class="${index === (state.cardSelections[product.id]?.colorIndex || 0) ? "selected" : ""}" style="background:${color.hex}" data-card-color="${product.id}" data-color-index="${index}" aria-label="Select ${color.name} for ${product.name}" title="${color.name}"></button>`;
    }
    function productCard(product) {
      const saved = state.saved.includes(product.id);
      const selection = state.cardSelections[product.id] || { colorIndex: 0, size: "" };
      const sizes = productSizes(product);
      return `<article class="product-card">
        <div class="product-visual" data-open="${product.id}">
          <button class="heart ${saved ? "saved" : ""}" data-save="${product.id}" aria-label="${saved ? "Remove from" : "Save to"} saved items">${saved ? "♥" : "♡"}</button>
          ${productArt(product, selection.colorIndex)}
        </div>
        <div class="product-info"><div><strong>${product.name}</strong><small>${product.category} · ${product.subcategory}</small></div><span>${product.salePrice ? `<del>${money(product.price)}</del><br>${money(product.salePrice)}` : money(product.price)}</span></div>
        <div class="product-badges">${product.tags.filter(tag => tag === "New" || tag === "Sale").map(tag => `<span class="product-badge ${tag.toLowerCase()}">${tag}</span>`).join("")}</div>
        <p class="assurance">${product.description}</p>
        <div class="product-variants" aria-label="Available colors">${product.colors.map((_, index) => productSwatch(product, index)).join("")}<small>${product.colors[selection.colorIndex]?.name || product.colors[0].name}</small></div>
        <div class="product-card-controls">${sizes.length ? `<select aria-label="Choose size for ${product.name}" data-card-size="${product.id}"><option value="">Choose size</option>${sizes.map(size => `<option value="${size}" ${selection.size === size ? "selected" : ""}>${size}</option>`).join("")}</select>` : `<span class="assurance">One size</span>`}<button type="button" class="btn btn-secondary" data-card-add="${product.id}">Add to Cart</button><button type="button" class="btn btn-primary card-buy" data-card-buy="${product.id}">Buy / Checkout</button></div>
      </article>`;
    }
    function home() {
      return `<section class="hero">
        <div class="hero-copy"><div class="eyebrow">Good gear. Good energy.</div><h1>Move your<br><span>own way.</span></h1><p class="subtle">Everyday sportswear made for campus life. Find your fit, rep your crew, and keep moving.</p><button class="btn btn-primary" data-go="shop">Shop the collection <span aria-hidden="true">→</span></button></div>
        <div class="hero-art"><div class="hero-shape"></div><img class="hero-photo" src="${products[1].colors[0].image}" alt="Kasi Athletics colorway placeholder" fetchpriority="high"><div class="hero-note">Designed for the daily move <span aria-hidden="true">✦</span></div></div>
      </section>
      <div class="section-head"><div><div class="eyebrow">Find your lane</div><h2>Shop by collection</h2></div></div>
      <div class="category-grid">
        <a class="category-card" href="#shop?category=Campus%20Collection" data-category="Campus Collection"><div><strong>Campus Collection</strong><small>Everyday layers, campus spirit</small></div><span class="category-symbol">◒</span></a>
        <a class="category-card" href="#shop?category=Footwear" data-category="Footwear"><div><strong>Footwear</strong><small>Comfort for wherever you're headed</small></div><span class="category-symbol">⌁</span></a>
        <a class="category-card" href="#customize"><div><strong>Customize</strong><small>Your colors. Your own pair.</small></div><span class="category-symbol">✳</span></a>
      </div>
      <div class="section-head"><div><div class="eyebrow">Student favorites</div><h2>Made for the everyday</h2></div><a class="text-link" href="#shop">View all</a></div>
      <div class="product-grid">${products.slice(0,4).map(productCard).join("")}</div>`;
    }
    function shop() {
      let list = products.filter(p => (state.category === "All" || p.category === state.category) &&
        (state.gender === "All" || p.gender === state.gender) &&
        (!state.size || p.sizes.includes(state.size)) &&
        (state.color === "All" || p.colors.some(color => color.name === state.color)) &&
        (state.priceRange === "All" ||
          (state.priceRange === "under-2000" && productPrice(p) < 2000) ||
          (state.priceRange === "2000-4000" && productPrice(p) >= 2000 && productPrice(p) < 4000) ||
          (state.priceRange === "4000-6000" && productPrice(p) >= 4000 && productPrice(p) < 6000) ||
          (state.priceRange === "6000-plus" && productPrice(p) >= 6000)) &&
        (!state.search || `${p.name} ${p.category} ${p.subcategory} ${p.description} ${p.tags.join(" ")}`.toLowerCase().includes(state.search.toLowerCase())));
      if (state.sort === "newest") list = list.slice().reverse();
      else if (state.sort === "price-low") list = list.slice().sort((a, b) => productPrice(a) - productPrice(b));
      else if (state.sort === "price-high") list = list.slice().sort((a, b) => productPrice(b) - productPrice(a));
      return `<div class="listing-top"><div><div class="eyebrow">Kasi Athletics</div><h1>Shop all</h1><p class="subtle">Your next everyday favorite is right here.</p></div><span class="results-count">${list.length} items</span></div>
      <div class="filters" aria-label="Product filters">
        <select id="category-filter" aria-label="Filter by category"><option value="All">All categories</option>${["Footwear","Clothing","Accessories","Campus Collection","Kids"].map(category => `<option value="${category}" ${state.category===category?"selected":""}>${category}</option>`).join("")}</select>
        <select id="gender-filter" aria-label="Filter by gender"><option value="All">All genders</option>${["men","women","kids","unisex"].map(gender => `<option value="${gender}" ${state.gender===gender?"selected":""}>${gender[0].toUpperCase()+gender.slice(1)}</option>`).join("")}</select>
        <select id="size-filter" aria-label="Filter by size"><option value="">All sizes</option>${[...new Set(products.flatMap(product => product.sizes))].map(size=>`<option value="${size}" ${state.size===size?"selected":""}>${size}</option>`).join("")}</select>
        <select id="color-filter" aria-label="Filter by color"><option value="All">All colors</option>${[...new Set(products.flatMap(product => product.colors.map(color => color.name)))].sort().map(color => `<option value="${color}" ${state.color===color?"selected":""}>${color}</option>`).join("")}</select>
        <select id="price-filter" aria-label="Filter by price range"><option value="All" ${state.priceRange==="All"?"selected":""}>Any price</option><option value="under-2000" ${state.priceRange==="under-2000"?"selected":""}>Under KES 2,000</option><option value="2000-4000" ${state.priceRange==="2000-4000"?"selected":""}>KES 2,000–3,999</option><option value="4000-6000" ${state.priceRange==="4000-6000"?"selected":""}>KES 4,000–5,999</option><option value="6000-plus" ${state.priceRange==="6000-plus"?"selected":""}>KES 6,000+</option></select>
        <select id="sort-filter" aria-label="Sort products"><option value="newest" ${state.sort==="newest"?"selected":""}>Newest</option><option value="price-low" ${state.sort==="price-low"?"selected":""}>Price: low to high</option><option value="price-high" ${state.sort==="price-high"?"selected":""}>Price: high to low</option></select>
      </div>${list.length ? `<div class="product-grid">${list.map(productCard).join("")}</div>` : `<div class="empty-state"><div class="empty-icon">⌕</div><h3>No gear found</h3><p class="subtle">Try changing your filters or search.</p><button class="btn btn-secondary" data-reset>Clear filters</button></div>`}`;
    }
    function detail() {
      const p = state.selectedProduct;
      return `<div class="detail-layout">
        <div class="detail-image">${productArt(p, state.selectedColor)}</div>
        <div class="detail-copy"><div class="eyebrow">${p.category} / ${p.subcategory}</div><h1>${p.name}</h1><div class="detail-price">${p.salePrice ? `<del>${money(p.price)}</del> ${money(p.salePrice)} <span class="product-badge sale">Sale</span>` : money(p.price)}</div><p class="subtle">${p.description}</p>
        <div class="field-label"><span>Color</span><span>${p.colors[state.selectedColor].name}</span></div>
        <div class="swatches">${p.colors.map((c,i)=>`<button class="swatch ${i===state.selectedColor?"selected":""}" style="background:${c.hex}" data-color="${i}" aria-label="Select ${c.name}" title="${c.name}"></button>`).join("")}</div>
        ${productSizes(p).length ? `<div class="field-label"><span>Choose your size</span><a class="text-link" href="#size-guide">Size guide</a></div><div class="sizes">${productSizes(p).map(s=>`<button class="size-btn ${state.selectedSize===s?"selected":""}" data-size="${s}">${s}</button>`).join("")}</div>` : `<div class="field-label"><span>One size</span></div>`}
        <div class="buy-row"><button class="btn btn-secondary" data-add="${p.id}">Add to Cart · ${money(productPrice(p))}</button><button class="heart ${state.saved.includes(p.id)?"saved":""}" data-save="${p.id}" aria-label="Save for later">${state.saved.includes(p.id)?"♥":"♡"}</button></div><button class="btn btn-primary btn-block" data-buy="${p.id}">Buy / Checkout</button>
        <p class="assurance">Easy 14-day returns · Confirm delivery costs with us on WhatsApp before you agree to order.</p></div></div>
        <div class="info-panels">
          <section class="panel"><h3>Details</h3><p>${p.description} Thoughtful everyday materials, easy-care finish and a comfortable regular fit. Designed for repeat wear.</p></section>
          <section class="panel" id="size-guide"><h3>Size guide</h3><p>Between sizes? We recommend sizing up for a relaxed fit. Sneaker sizes follow UK sizing. Check your usual UK shoe size before ordering.</p></section>
          <section class="panel reviews"><h3>Reviews <span class="stars">★★★★☆</span> <small class="subtle">(sample reviews)</small></h3>
            <div class="review"><div class="review-head"><span>Wanjiku M.</span><span class="stars">★★★★★</span></div><p class="subtle">Really comfy for walking across campus. The color looks just like the photos.</p></div>
            <div class="review"><div class="review-head"><span>Brian K.</span><span class="stars">★★★☆☆</span></div><p class="subtle">Good value and nice style. Took a little longer to break in than I expected.</p></div>
          </section>
          <section class="panel"><h3>Returns, made simple</h3><p>Changed your mind? Return unworn items within 14 days of delivery. We’ll show delivery charges before you place your order.</p></section>
        </div>`;
    }
    function customizer() {
      const c = state.customization;
      const options = { body: [["Cream","#e8d8bb"],["Black","#282b2a"],["Blue","#567c9e"],["Coral","#e35d4e"]], laces: [["White","#f7f7f2"],["Black","#282b2a"],["Yellow","#e9c866"],["Coral","#e35d4e"]], sole: [["White","#f7f7f2"],["Black","#282b2a"],["Green","#71866c"],["Blue","#567c9e"]] };
      return `<div class="listing-top"><div><div class="eyebrow">Make it yours</div><h1>Build your pair</h1><p class="subtle">Pick your colors. We'll make it personal.</p></div></div>
      <div class="customizer-layout"><div class="preview-box">${iconShoe(c.body,c.sole,c.laces,"custom")}<span class="preview-caption">Live preview · Kasi Custom Low</span></div>
      <section class="custom-controls"><div class="eyebrow">Your custom sneaker</div><h2>Kasi Custom Low</h2><p class="subtle">A one-of-a-kind pair built around your colors.</p>
        ${Object.entries(options).map(([key, choices])=>`<div class="option-group"><div class="option-title"><span>${key[0].toUpperCase()+key.slice(1)}</span><span>${choices.find(x=>x[1]===c[key])[0]}</span></div><div class="color-choice">${choices.map(([name,color])=>`<button class="${c[key]===color?"selected":""}" data-part="${key}" data-value="${color}" aria-label="${key}: ${name}"><span class="color-dot" style="background:${color}"></span>${name}</button>`).join("")}</div></div>`).join("")}
        <div class="custom-price"><span>Custom pair</span><span>${money(4500)}</span></div>
        <div class="custom-actions"><button class="btn btn-primary" data-custom-add>Add to Cart · ${money(4500)}</button><button class="btn btn-secondary" data-save-design>${state.designSaved ? "✓ &nbsp; Design Saved" : "♡ &nbsp; Save Design"}</button></div>
      </section></div>`;
    }
    function checkoutReturn() {
      return `<section class="confirmation"><div class="confirm-icon">…</div><div class="eyebrow">Payment status</div><h1>Your payment status</h1>
        <p class="subtle">${state.paymentStatusMessage || "A redirect back from IntaSend is not proof of payment. We are checking the verified order status."}</p>
        <button class="btn btn-secondary" data-refresh-payment-status>Check payment status</button>
        <p class="assurance">Your order is paid only after IntaSend confirms it to our backend. Delivery is arranged separately on WhatsApp.</p>
        <button class="btn btn-secondary" data-go="cart">Return to cart</button></section>`;
    }
    function cart() {
      if (!state.cart.length) return `<section class="empty-state"><div class="empty-icon">🛍</div><h2>Your cart is waiting</h2><p class="subtle">Add something you love and it’ll show up here.</p><button class="btn btn-primary" data-go="shop">Explore the collection</button></section>`;
      return `<div class="listing-top"><div><div class="eyebrow">Your picks</div><h1>Shopping cart</h1><p class="subtle">Review your items before placing your order.</p></div></div>
      <div class="cart-layout"><section class="cart-items">${state.cart.map((item,index)=>`<div class="cart-row"><div class="cart-thumb">${item.custom?iconShoe(item.colors.body,item.colors.sole,item.colors.laces,"cart"+index):productArt(item.product,item.colorIndex)}</div><div><strong>${item.custom?"Kasi Custom Low":item.product.name}</strong><small>${item.custom?"Custom colors · Made for you":`${item.size && item.size !== "One size" ? `Size: ${item.size}` : "One size"} · ${item.colorName || "Original color"}`}</small><div class="qty-control"><button data-qty="${index}" data-delta="-1" aria-label="Decrease quantity">−</button><span>${item.quantity}</span><button data-qty="${index}" data-delta="1" aria-label="Increase quantity">+</button></div></div><div><div class="cart-row-price">${money((item.custom?4500:productPrice(item.product))*item.quantity)}</div><button class="remove-button" data-remove="${index}">Remove</button></div></div>`).join("")}</section>
      <aside class="summary-card"><h3>Order summary</h3><div class="summary-line"><span>Items subtotal</span><span>${money(total())}</span></div><div class="summary-line"><span>Delivery</span><span>Arranged separately on WhatsApp</span></div><div class="summary-line total"><span>Items subtotal</span><span>${money(total())}</span></div>
        <p class="checkout-contact">Online checkout charges the item subtotal only. Contact Kasi on WhatsApp to arrange delivery separately.</p>
        <p class="assurance">WhatsApp requests are not confirmed until Kasi replies. No online payment is taken while secure checkout is unavailable. Card details are entered only on IntaSend's hosted checkout.</p>
        ${state.user ? "" : `<p class="guest-checkout-note">Want this cart on your account? <button type="button" class="auth-text-button" data-login>Log in or sign up</button>, or continue as a guest and request on WhatsApp.</p>`}
        <div class="custom-actions"><button class="btn ${state.paymentEnabled ? "btn-primary" : "btn-disabled"} btn-block" type="button" ${state.paymentEnabled && !state.checkoutBusy ? "" : "disabled"} aria-describedby="payment-coming-soon" data-start-checkout>${state.checkoutBusy ? "Starting secure checkout…" : state.paymentEnabled ? "Proceed to pay" : "Proceed to pay · Coming soon"}</button><small id="payment-coming-soon" class="assurance">${state.paymentMessage}</small><button class="btn btn-primary btn-block" data-whatsapp-order>Request on WhatsApp</button></div></aside></div>`;
    }
    function authPage(mode) {
      const signup = mode === "signup";
      const input = (id, label, type, autocomplete, errorId, attributes = "") => `
        <div class="auth-field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" autocomplete="${autocomplete}" aria-describedby="${errorId}" ${attributes}><p class="field-error" id="${errorId}" aria-live="polite"></p></div>`;
      return `<section class="auth-panel" aria-labelledby="auth-title">
        <div class="eyebrow">Kasi Athletics account</div><h1 id="auth-title">${signup ? "Create your account" : "Welcome back"}</h1>
        <p class="subtle">${signup ? "Save your details, cart and wishlist for next time." : "Log in to see your saved items and account details."}</p>
        <form class="auth-form" id="auth-form" data-auth-form="${mode}" novalidate>
          ${signup ? input("auth-name", "Name", "text", "name", "auth-name-error", 'maxlength="80"') : ""}
          ${input("auth-email", "Email", "email", "email", "auth-email-error", 'maxlength="254"')}
          ${signup ? input("auth-phone", "Phone", "tel", "tel", "auth-phone-error", 'maxlength="24" placeholder="+254 700 000 000"') : ""}
          ${input("auth-password", "Password", "password", signup ? "new-password" : "current-password", "auth-password-error", 'maxlength="128"')}
          ${signup ? input("auth-confirm-password", "Confirm password", "password", "new-password", "auth-confirm-password-error", 'maxlength="128"') : ""}
          <div class="auth-password-row"><button type="button" class="auth-text-button" data-toggle-password>Show password</button>${signup ? "" : `<a class="text-link" href="#forgot-password" data-forgot-password>Forgot password?</a>`}</div>
          <p class="field-error" id="auth-form-error" role="alert" aria-live="assertive">${escapeHtml(state.authNotice)}</p>
          <button class="btn btn-primary btn-block" type="submit" ${state.authBusy ? "disabled" : ""}>${state.authBusy ? "Please wait…" : signup ? "Create account" : "Log in"}</button>
        </form>
        <p class="auth-footer">${signup ? `Already have an account? <a class="text-link" href="#login" data-auth-screen="login">Log in</a>` : `Don't have an account? <a class="text-link" href="#signup" data-auth-screen="signup">Sign up</a>`}</p>
        <p class="auth-notice">You can browse and request on WhatsApp as a guest. Your cart stays in this page while you sign in.</p>
      </section>`;
    }
    function accountPage() {
      if (!state.user) return `<section class="empty-state"><h1>Sign in to your account</h1><p class="subtle">Log in or create an account to see your saved details.</p><button class="btn btn-primary" data-auth-screen="login">Log in</button></section>`;
      const savedProducts = products.filter(product => state.saved.includes(product.id));
      return `<div class="listing-top"><div><div class="eyebrow">Kasi Athletics</div><h1>Your account</h1><p class="subtle">Manage your profile and saved gear.</p></div><button class="btn btn-secondary" data-logout ${state.authBusy ? "disabled" : ""}>Log out</button></div>
        ${state.authNotice ? `<p class="auth-notice" role="status">${escapeHtml(state.authNotice)}</p>` : ""}
        <div class="panel account-layout"><div class="account-details"><div><strong>Name</strong><span>${escapeHtml(state.user.name)}</span></div><div><strong>Email</strong><span>${escapeHtml(state.user.email)}</span></div><div><strong>Phone</strong><span>${escapeHtml(state.user.phone)}</span></div></div></div>
        <div class="info-panels"><section class="panel"><h3>Order history</h3><p>No orders are linked to your account yet. Guest and WhatsApp requests are not shown here.</p></section><section class="panel"><h3>Saved cart</h3><p>Your cart and wishlist are saved to this account when you are signed in. Payment remains unavailable until checkout is configured.</p></section></div>
        <div class="section-head"><div><div class="eyebrow">Your saved items</div><h2>Wishlist</h2></div></div>
        ${savedProducts.length ? `<div class="product-grid">${savedProducts.map(productCard).join("")}</div>` : `<section class="empty-state"><p class="subtle">Your wishlist is empty. Save items with the heart button while you shop.</p><button class="btn btn-secondary" data-go="shop">Browse the collection</button></section>`}`;
    }
    function orderMessage() {
      const lines=state.cart.map(item=>{
        const name=item.custom?"Kasi Custom Low":item.product.name;
        const details=item.custom
          ? `custom colors: body ${item.colors.body}, laces ${item.colors.laces}, sole ${item.colors.sole}`
          : `size ${item.size || "not selected"}, color ${item.colorName || "original"}`;
        return `- ${name} x${item.quantity} (${details}) — ${money((item.custom?4500:productPrice(item.product))*item.quantity)}`;
      });
      return `Hi Kasi Athletics! I'd like to request these items:\n${lines.join("\n")}\nItems subtotal: ${money(total())}\nPlease confirm availability, delivery cost and payment options. I understand this request is not confirmed until you reply.`;
    }
    function total() { return state.cart.reduce((sum,item)=>sum+(item.custom?4500:productPrice(item.product))*item.quantity,0); }
    function render() {
      app.innerHTML = state.screen==="home" ? home() : state.screen==="shop" ? shop() : state.screen==="product" ? detail() : state.screen==="customize" ? customizer() : state.screen==="checkout-return" ? checkoutReturn() : state.screen==="login" || state.screen==="signup" ? authPage(state.screen) : state.screen==="account" ? accountPage() : cart();
      document.getElementById("cart-count").textContent = state.cart.reduce((n,x)=>n+x.quantity,0);
      document.getElementById("account-nav-label").textContent = state.user ? state.user.name.split(/\s+/)[0] : "Log in";
      document.getElementById("account-nav").setAttribute("aria-label", state.user ? `Open ${state.user.name}'s account` : "Log in or create an account");
      document.querySelectorAll(".main-nav a").forEach(a=>a.classList.toggle("active", a.getAttribute("href")===`#${state.screen}`));
    }
    const paymentApiBase = typeof window.PAYMENTS_API_BASE === "string" ? window.PAYMENTS_API_BASE.replace(/\/+$/, "") : "";
    async function accountRequest(path, { method = "GET", body } = {}) {
      if (!paymentApiBase) throw new Error("Account service is not configured in this storefront.");
      const headers = { "X-Requested-With": "KasiAthletics" };
      if (body !== undefined) headers["Content-Type"] = "application/json";
      const response = await fetch(`${paymentApiBase}${path}`, {
        method,
        headers,
        credentials: "include",
        cache: "no-store",
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      let result;
      try {
        result = await response.json();
      } catch {
        throw new Error("Account service returned an invalid response.");
      }
      if (!response.ok) {
        const error = new Error(result.message || "Account request failed.");
        error.field = result.field;
        error.status = response.status;
        throw error;
      }
      return result;
    }
    function accountCartPayload() {
      return state.cart.map(item => item.custom
        ? { productId: "custom-low", quantity: item.quantity, colors: item.colors }
        : {
          productId: item.product.id,
          quantity: item.quantity,
          size: item.size,
          color: item.colorName
        });
    }
    function hydrateCartItem(item) {
      if (item.productId === "custom-low") {
        const key = JSON.stringify(item.colors);
        return { key, custom: true, quantity: item.quantity, colors: item.colors };
      }
      const product = products.find(candidate => candidate.id === item.productId);
      if (!product) return null;
      const colorIndex = product.colors.findIndex(color => color.name === item.color);
      if (colorIndex < 0) return null;
      const size = item.size;
      const key = `${product.id}:${size}:${item.color}`;
      return {
        key, product, quantity: item.quantity, size, colorIndex, colorName: item.color
      };
    }
    function mergeAccountCart(accountCart, guestCart) {
      const merged = [];
      for (const item of [...accountCart, ...guestCart]) {
        const key = item.custom ? JSON.stringify(item.colors) : `${item.product.id}:${item.size}:${item.colorName}`;
        const current = merged.find(existing => existing.key === key);
        if (current) current.quantity = Math.min(10, current.quantity + item.quantity);
        else merged.push({ ...item, key, quantity: Math.min(10, item.quantity) });
      }
      return merged;
    }
    async function persistAccountState() {
      if (!state.user) return true;
      state.authSync = state.authSync.catch(() => false).then(async () => {
        if (!state.user) return true;
        try {
          await accountRequest("/api/account/state", {
            method: "PUT",
            body: { cart: accountCartPayload(), wishlist: state.saved }
          });
          return true;
        } catch {
          toast("Your account changes could not be saved. Please try again.");
          return false;
        }
      });
      return state.authSync;
    }
    async function mergeSavedAccountState(guestCart, guestWishlist) {
      const result = await accountRequest("/api/account/state");
      const accountCart = result.state.cart.map(hydrateCartItem).filter(Boolean);
      state.cart = mergeAccountCart(accountCart, guestCart);
      state.saved = [...new Set([...result.state.wishlist, ...guestWishlist])];
      return persistAccountState();
    }
    function setAuthFieldError(field, message) {
      const target = document.getElementById(`auth-${field}-error`);
      const input = document.getElementById(`auth-${field}`);
      if (target && input) {
        target.textContent = message;
        input.setAttribute("aria-invalid", "true");
        return input;
      }
      const formError = document.getElementById("auth-form-error");
      if (formError) formError.textContent = message;
      return null;
    }
    async function submitAuthForm(form) {
      const signup = form.dataset.authForm === "signup";
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;
      const name = signup ? document.getElementById("auth-name").value.trim() : "";
      const phone = signup ? document.getElementById("auth-phone").value.trim() : "";
      const confirmPassword = signup ? document.getElementById("auth-confirm-password").value : "";
      form.querySelectorAll(".field-error").forEach(field => { if (field.id !== "auth-form-error") field.textContent = ""; });
      form.querySelectorAll("[aria-invalid=true]").forEach(input => input.removeAttribute("aria-invalid"));
      document.getElementById("auth-form-error").textContent = "";

      const invalid = [];
      if (signup && !name) invalid.push(setAuthFieldError("name", "Enter your name."));
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) invalid.push(setAuthFieldError("email", "Enter a valid email address."));
      if (signup && !/^\+?[0-9][0-9\s()-]{6,19}$/.test(phone)) invalid.push(setAuthFieldError("phone", "Enter a valid phone number."));
      if (password.length < 8) invalid.push(setAuthFieldError("password", "Password must be at least 8 characters."));
      if (signup && password.length >= 8 && password !== confirmPassword) {
        invalid.push(setAuthFieldError("confirm-password", "Passwords do not match."));
      }
      const firstInvalid = invalid.find(Boolean);
      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }

      state.authBusy = true;
      const submit = form.querySelector('[type="submit"]');
      submit.disabled = true;
      submit.textContent = signup ? "Creating account…" : "Logging in…";
      try {
        const result = await accountRequest(signup ? "/api/auth/register" : "/api/auth/login", {
          method: "POST",
          body: signup ? { name, email, phone, password } : { email, password }
        });
        const guestCart = state.cart.map(item => ({ ...item }));
        const guestWishlist = [...state.saved];
        state.user = result.user;
        state.authNotice = "";
        let synced = false;
        try {
          synced = await mergeSavedAccountState(guestCart, guestWishlist);
        } catch {
          synced = false;
        }
        state.authBusy = false;
        const destination = state.returnTo || "home";
        go(destination);
        toast(signup ? "Account created ✓" : "You're logged in ✓");
        if (!synced) toast("You're signed in, but saved cart details could not be synced.");
      } catch (error) {
        state.authBusy = false;
        submit.disabled = false;
        submit.textContent = signup ? "Create account" : "Log in";
        const field = error.field;
        if (field === "name" || field === "email" || field === "phone" || field === "password") {
          setAuthFieldError(field, error.message)?.focus();
        } else {
          document.getElementById("auth-form-error").textContent = error.message;
        }
        if (!document.getElementById("auth-form")) render();
      }
    }
    async function refreshAccountSession() {
      try {
        const result = await accountRequest("/api/auth/session");
        state.user = result.user;
        if (state.user) {
          try {
            const saved = await accountRequest("/api/account/state");
            state.cart = saved.state.cart.map(hydrateCartItem).filter(Boolean);
            state.saved = saved.state.wishlist;
          } catch (error) {
            if (error.status === 401) state.user = null;
            else state.authNotice = "Your account is signed in, but saved shopping data could not be loaded.";
          }
        }
      } catch {
        state.user = null;
      }
      render();
    }
    async function logout() {
      if (state.authBusy) return;
      state.authBusy = true;
      render();
      try {
        await state.authSync;
        await accountRequest("/api/auth/logout", { method: "POST", body: {} });
        state.user = null;
        state.cart = [];
        state.saved = [];
        state.authNotice = "";
        state.authBusy = false;
        go("home");
        toast("You're logged out.");
      } catch {
        state.authBusy = false;
        render();
        toast("Could not log out. Please try again.");
      }
    }
    async function refreshPaymentReadiness() {
      if (!paymentApiBase) return;
      try {
        const response = await fetch(`${paymentApiBase}/api/config`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Payment readiness returned HTTP ${response.status}`);
        const config = await response.json();
        state.paymentEnabled = config.paymentsEnabled === true;
        state.paymentMessage = state.paymentEnabled
          ? "IntaSend sandbox checkout is ready for testing; sandbox payments are not real charges. Delivery is arranged separately on WhatsApp."
          : "Secure online payments are not set up yet.";
      } catch (error) {
        console.error("Could not check secure checkout readiness.", error);
        state.paymentEnabled = false;
        state.paymentMessage = "Secure payment is unavailable right now. You can still request on WhatsApp.";
      }
      if (state.screen === "cart") render();
    }
    async function startCheckout() {
      if (!paymentApiBase || !state.paymentEnabled || state.checkoutBusy || !state.cart.length) return;
      state.checkoutBusy = true;
      render();
      const items = state.cart.map(item => item.custom
        ? { productId: "custom-low", quantity: item.quantity, colors: item.colors }
        : { productId: item.product.id, quantity: item.quantity, size: item.size, color: item.colorName });
      try {
        const response = await fetch(`${paymentApiBase}/api/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items })
        });
        const result = await response.json();
        if (!response.ok || typeof result.checkoutUrl !== "string") {
          if (response.status === 503) {
            state.paymentEnabled = false;
            state.paymentMessage = "Secure online payments are not configured. You can still request on WhatsApp.";
          } else {
            state.paymentMessage = result.message || "Checkout could not be started. No payment was taken.";
          }
          throw new Error(state.paymentMessage);
        }
        const checkoutUrl = new URL(result.checkoutUrl);
        if (checkoutUrl.protocol !== "https:" || checkoutUrl.hostname !== "sandbox.intasend.com") {
          throw new Error("The checkout destination was not a trusted IntaSend sandbox URL.");
        }
        window.location.assign(checkoutUrl.href);
      } catch (error) {
        console.error("Secure checkout could not be started.", error);
        state.checkoutBusy = false;
        state.paymentMessage = error.message || "Checkout could not be started. No payment was taken.";
        render();
        toast("Checkout could not start. No payment was taken.");
      }
    }
    async function refreshOrderStatus() {
      if (!paymentApiBase || !state.checkoutOrderId) {
        state.paymentStatusMessage = "Order status is not available. Please contact Kasi on WhatsApp.";
        render();
        return;
      }
      state.paymentStatusMessage = "Checking the verified order status…";
      render();
      try {
        const response = await fetch(`${paymentApiBase}/api/orders/${encodeURIComponent(state.checkoutOrderId)}`, { cache: "no-store" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Could not retrieve order status.");
        if (result.status === "paid") state.paymentStatusMessage = "IntaSend confirmed payment. Your order is paid.";
        else if (result.status === "payment_failed") state.paymentStatusMessage = "Payment was not completed. Your order is not paid.";
        else if (result.status === "checkout_failed") state.paymentStatusMessage = "Checkout could not be started. No payment was taken.";
        else state.paymentStatusMessage = "Payment is still pending. This page does not confirm payment.";
      } catch (error) {
        console.error("Could not retrieve verified order status.", error);
        state.paymentStatusMessage = "Payment status could not be confirmed yet. Please check again or contact Kasi on WhatsApp.";
      }
      render();
    }
    function toast(message="Added to cart ✓") {
      const node=document.getElementById("toast"); node.textContent=message; node.classList.add("show");
      clearTimeout(toast.timer); toast.timer=setTimeout(()=>node.classList.remove("show"),2100);
    }
    function addProduct(product, custom=false, choices={}) {
      const size = choices.size ?? state.selectedSize;
      const colorIndex = choices.colorIndex ?? state.selectedColor;
      const colorName = custom ? "" : product.colors[colorIndex].name;
      const key = custom ? JSON.stringify(state.customization) : `${product.id}:${size}:${colorName}`;
      const found=state.cart.find(x=>x.key===key);
      if(found && found.quantity >= 10) { toast("Maximum 10 per item"); return; }
      if(found) found.quantity++;
      else state.cart.push(custom ? {key,custom:true,quantity:1,colors:{...state.customization}} : {key,product,quantity:1,size: size || (product.sizes.includes("One size") ? "One size" : ""),colorIndex,colorName});
      render(); toast();
      if (state.user) void persistAccountState();
    }
    app.addEventListener("click", e => {
      const t=e.target.closest("button,a,[data-open]");
      if(!t) return;
      if(t.matches("[data-auth-screen]")) {
        e.preventDefault();
        state.authNotice = "";
        go(t.dataset.authScreen);
        document.getElementById(state.screen === "signup" ? "auth-name" : "auth-email")?.focus();
        return;
      }
      if(t.matches("[data-login]")) {
        state.returnTo = "cart";
        state.authNotice = "";
        go("login");
        document.getElementById("auth-email")?.focus();
        return;
      }
      if(t.matches("[data-toggle-password]")) {
        const fields = [...document.querySelectorAll('#auth-form input[type="password"], #auth-form input[data-visible="true"]')];
        const show = fields.some(field => field.type === "password");
        fields.forEach(field => {
          field.type = show ? "text" : "password";
          field.dataset.visible = show ? "true" : "false";
        });
        t.textContent = show ? "Hide password" : "Show password";
        return;
      }
      if(t.matches("[data-forgot-password]")) {
        e.preventDefault();
        const message = document.getElementById("auth-form-error");
        message.innerHTML = `Password reset email is not configured. Contact <a href="https://wa.me/254700769417" target="_blank" rel="noopener noreferrer">Kasi on WhatsApp</a> for account support.`;
        return;
      }
      if(t.matches("[data-logout]")) { void logout(); return; }
      if(t.matches("#account-nav")) {
        if (state.user) go("account");
        else {
          if (!["login", "signup", "account"].includes(state.screen)) state.returnTo = state.screen;
          state.authNotice = "";
          go("login");
        }
        return;
      }
      if(t.matches("[data-go]")) { e.preventDefault(); go(t.dataset.go); return; }
      if(t.matches("[data-category]")) { e.preventDefault(); go("shop",{category:t.dataset.category}); return; }
      if(t.matches("[data-open]")) { go("product",{product:products.find(p=>p.id===t.dataset.open)}); return; }
      if(t.matches("[data-save]")) { const id=t.dataset.save; state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id]; render(); toast(state.saved.includes(id)?"Saved for later ✓":"Removed from saved items"); if(state.user) void persistAccountState(); return; }
      if(t.matches("[data-card-color]")) {
        const productId = t.dataset.cardColor;
        const current = state.cardSelections[productId] || { colorIndex: 0, size: "" };
        state.cardSelections[productId] = { ...current, colorIndex: Number(t.dataset.colorIndex) };
        render();
        return;
      }
      if(t.matches("[data-color]")) { state.selectedColor=Number(t.dataset.color); render(); return; }
      if(t.matches("[data-size]")) { state.selectedSize=t.dataset.size; render(); return; }
      if(t.matches("[data-add]")) {
        const product = products.find(p=>p.id===t.dataset.add);
        if(productSizes(product).length && !state.selectedSize){toast("Choose a size first");return;}
        addProduct(product, false, { size: state.selectedSize, colorIndex: state.selectedColor });
        return;
      }
      if(t.matches("[data-card-add], [data-card-buy]")) {
        const productId = t.dataset.cardAdd || t.dataset.cardBuy;
        const product = products.find(item => item.id === productId);
        const selection = state.cardSelections[productId] || { colorIndex: 0, size: "" };
        if(productSizes(product).length && !selection.size) { toast("Choose a size first"); return; }
        addProduct(product, false, selection);
        if(t.matches("[data-card-buy]")) go("cart");
        return;
      }
      if(t.matches("[data-buy]")) {
        const product = products.find(item => item.id === t.dataset.buy);
        if(productSizes(product).length && !state.selectedSize) { toast("Choose a size first"); return; }
        addProduct(product, false, { size: state.selectedSize, colorIndex: state.selectedColor });
        go("cart");
        return;
      }
      if(t.matches("[data-part]")) { state.customization[t.dataset.part]=t.dataset.value; state.designSaved=false; render(); return; }
      if(t.matches("[data-custom-add]")) { addProduct(null,true); return; }
      if(t.matches("[data-save-design]")) { state.savedDesign={...state.customization}; state.designSaved=true; render(); toast("Design saved ✓"); return; }
      if(t.matches("[data-qty]")) { const item=state.cart[Number(t.dataset.qty)]; const quantity=item.quantity+Number(t.dataset.delta); if(quantity>10){toast("Maximum 10 per item");return;} item.quantity=quantity; if(item.quantity<1) state.cart.splice(Number(t.dataset.qty),1); render(); if(state.user) void persistAccountState(); return; }
      if(t.matches("[data-remove]")) { state.cart.splice(Number(t.dataset.remove),1); render(); if(state.user) void persistAccountState(); return; }
      if(t.matches("[data-start-checkout]")) { void startCheckout(); return; }
      if(t.matches("[data-refresh-payment-status]")) { void refreshOrderStatus(); return; }
      if(t.matches("[data-whatsapp-order]")) {
        if(!state.cart.length) return;
        window.open(`https://wa.me/254700769417?text=${encodeURIComponent(orderMessage())}`, "_blank", "noopener,noreferrer");
        toast("WhatsApp opened. Send your request to finish.");
        return;
      }
      if(t.matches("[data-reset]")) { state.category="All";state.gender="All";state.priceRange="All";state.size="";state.color="All";state.sort="newest";state.search="";render();return; }
    });
    document.getElementById("cart-nav").addEventListener("click",()=>go("cart"));
    document.getElementById("account-nav").addEventListener("click",()=>{
      if (state.user) {
        go("account");
        return;
      }
      if (!["login", "signup", "account"].includes(state.screen)) state.returnTo = state.screen;
      state.authNotice = "";
      go("login");
      document.getElementById("auth-email")?.focus();
    });
    document.getElementById("search").addEventListener("input",e=>{state.search=e.target.value;if(state.screen!=="shop")go("shop");else render();});
    app.addEventListener("submit",e=>{
      if(e.target.matches("#auth-form")) {
        e.preventDefault();
        void submitAuthForm(e.target);
      }
    });
    app.addEventListener("change",e=>{
      if(e.target.id==="category-filter"){state.category=e.target.value;render();}
      if(e.target.id==="gender-filter"){state.gender=e.target.value;render();}
      if(e.target.id==="size-filter"){state.size=e.target.value;render();}
      if(e.target.id==="color-filter"){state.color=e.target.value;render();}
      if(e.target.id==="price-filter"){state.priceRange=e.target.value;render();}
      if(e.target.id==="sort-filter"){state.sort=e.target.value;render();}
      if(e.target.matches("[data-card-size]")) {
        const productId = e.target.dataset.cardSize;
        const current = state.cardSelections[productId] || { colorIndex: 0, size: "" };
        state.cardSelections[productId] = { ...current, size: e.target.value };
        render();
      }
    });
    window.addEventListener("hashchange",()=>{
      const hash=location.hash.slice(1);
      if(hash.startsWith("checkout-return/")) {
        state.screen="checkout-return";
        state.checkoutOrderId=hash.slice("checkout-return/".length);
        render();
        void refreshOrderStatus();
        return;
      }
      if(hash.startsWith("shop")) { const category=hash.split("category=")[1];go("shop",{category:category?decodeURIComponent(category):"All"}); }
      else if(["home","customize","cart","login","signup","account"].includes(hash)) go(hash);
    });
    document.querySelectorAll(".main-nav a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();if(a.hash.startsWith("#shop"))go("shop",{category:a.hash.includes("Campus")?"Campus Collection":"All"});else go(a.hash.slice(1));}));
    const initialHash = location.hash.slice(1);
    if (initialHash.startsWith("checkout-return/")) {
      state.screen = "checkout-return";
      state.checkoutOrderId = initialHash.slice("checkout-return/".length);
    } else if (initialHash.startsWith("shop")) {
      state.screen = "shop";
      const category = initialHash.split("category=")[1];
      state.category = category ? decodeURIComponent(category) : "All";
    } else if (["home", "customize", "cart", "login", "signup", "account"].includes(initialHash)) {
      state.screen = initialHash;
    }
    render();
    void refreshPaymentReadiness();
    void refreshAccountSession();
    if (state.screen === "checkout-return") void refreshOrderStatus();
  </script>
</body>
</html>
